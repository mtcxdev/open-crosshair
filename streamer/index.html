<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenCrosshair Streamer View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #crosshair-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div id="crosshair-container"></div>

  <script>
    const container = document.getElementById('crosshair-container');
    let socket = null;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}`;
      socket = new WebSocket(wsUrl);

      socket.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'UPDATE_CROSSHAIR' && message.data) {
            renderCrosshair(message.data);
          }
        } catch (e) {
          console.error('Error processing websocket message', e);
        }
      };

      socket.onclose = () => {
        setTimeout(connect, 2000);
      };

      socket.onerror = () => {
        socket.close();
      };
    }

    function renderCrosshair(config) {
      if (!config || !config.svg) return;
      container.innerHTML = config.svg;
    }

    // Initial fetch fallback
    fetch('/api/state')
      .then(res => res.json())
      .then(state => {
        if (state && state.svg) {
          renderCrosshair(state);
        }
      })
      .catch(() => {});

    connect();
  </script>
</body>
</html>
